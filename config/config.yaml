# ============================================================
# Binance Triangular Arbitrage Bot — Auto-Execute
# ============================================================
# VPS: Tokyo, Japan (Binance matching engine = AWS ap-northeast-1)
#   Best value:  Vultr Tokyo High Frequency  ~$24/month  ~2ms latency
#   Best latency: AWS EC2 c5n.large Tokyo    ~$85/month  <1ms latency
#   Budget:      Contabo VPS Tokyo           ~$7/month   ~4ms latency
#
# Nigeria / Binance note:
#   - Bot runs from Tokyo VPS → Binance's IP-based geo-fencing is bypassed
#   - Account-level restrictions (if any) are caught at startup
#   - If running LOCALLY in Nigeria, set BINANCE_PROXY in .env
#   - Spot trading API (what this bot uses) has NOT been restricted for
#     Nigerian accounts — only NGN fiat/P2P gateways were affected
# ============================================================

bot:
  mode: live             # auto-execute — real orders
  log_level: INFO
  heartbeat_interval: 30
  startup_countdown: 5   # seconds to Ctrl-C before live trading begins

exchanges:
  binance:
    recv_window: 5000
    websocket_reconnect_delay: 1
    # Enable BNB fee discount in your Binance account → set fee_rate to 0.00075

triangular:
  triangles:
    - [USDT, BTC, ETH]
    - [USDT, BTC, BNB]
    - [USDT, BTC, SOL]
    - [USDT, BTC, XRP]
    - [USDT, BTC, ADA]
    - [USDT, BTC, DOGE]
    - [USDT, BTC, LTC]
    - [USDT, ETH, BNB]
    - [USDT, ETH, SOL]
    - [USDT, ETH, MATIC]
    - [USDT, BNB, SOL]
    - [USDT, BNB, XRP]

  min_profit_pct: 0.12       # minimum NET profit % after all fees
  trade_amount_usdt: 100
  max_trade_amount_usdt: 1000
  fee_rate: 0.001            # 0.1% standard | 0.00075 with BNB discount
  order_timeout_seconds: 8

risk:
  # ── Daily limits ────────────────────────────────────────────
  # Hard stop: bot halts for the rest of the day if total PnL (profit minus
  # all fees and slippage losses) drops by this amount.
  # This is NOT just on fees — it's total net loss including slippage.
  max_daily_loss_usdt: 50

  # Hard stop: halt if balance falls this % below the peak balance seen this session.
  max_drawdown_pct: 5

  # Fee budget: if the bot pays more than this in Binance fees today, halt.
  # Prevents the bot from churning trades that collectively cost more than they earn.
  # Example: fee_rate=0.1% × 3 legs = 0.3% per cycle. At $100/cycle that's $0.30/trade.
  # 30 trades = $9 in fees. Set this conservatively.
  max_daily_fees_usdt: 30

  # ── Per-trade cap ────────────────────────────────────────────
  # Any single triangle cycle that results in a loss larger than this halts the bot.
  # Protects against catastrophic slippage or partial-fill scenarios.
  max_loss_per_trade_usdt: 5

  # ── Consecutive loss protection ──────────────────────────────
  # After this many losses in a row, pause trading for the cooldown period.
  # This is a WARNING signal — market conditions may have changed.
  max_consecutive_losses: 3
  consecutive_loss_cooldown_seconds: 300   # 5 minutes

  # ── Profit/fee safety margin ─────────────────────────────────
  # Expected profit must be at least this multiple of the fee cost.
  # With fee=0.1%×3=0.3% total and ratio=1.5, we need profit ≥ 0.45% to trade.
  # This prevents trading opportunities that only profit after perfect execution
  # but go negative with any slippage.
  min_profit_fee_ratio: 1.5

  # ── Position limits ──────────────────────────────────────────
  max_open_orders: 2
  min_balance_usdt: 25       # never trade below this reserve
  max_position_pct: 25       # max % of balance per trade cycle

performance:
  report_interval_minutes: 60
  save_trades_csv: true
  trades_file: logs/trades.csv
