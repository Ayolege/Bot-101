# ============================================================
# Binance Triangular Arbitrage Bot — $50 Starting Capital
# ============================================================
# VPS: Tokyo, Japan (Binance matching engine = AWS ap-northeast-1)
#   Best value:  Vultr Tokyo High Frequency  ~$24/month  ~2ms latency
#   Best latency: AWS EC2 c5n.large Tokyo    ~$85/month  <1ms latency
#   Budget start: Contabo VPS Tokyo          ~$7/month   ~4ms latency
#
# $50 capital math:
#   Trade size  : $15 per cycle
#   Fee per cycle: 0.1% × 3 legs = 0.3% = $0.045 on $15
#   Min profit  : 0.5% net = $0.075 per profitable trade
#   Daily target: $0.50–$2.00 realistic (compound grows this)
#   Daily limit : $5 max loss (10% of capital)
# ============================================================

bot:
  mode: live
  log_level: INFO
  heartbeat_interval: 30
  startup_countdown: 5

exchanges:
  binance:
    recv_window: 5000
    websocket_reconnect_delay: 1

# ── Triangle discovery ────────────────────────────────────────
# auto_discover=true: bot queries Binance markets at startup,
# builds every valid USDT triangle, sorts by liquidity, and scans
# all of them — typically 100–200+ triangles across BTC/ETH/BNB bridges.
#
# Scaling guide:
#   $50  capital → min_pair_volume_usdt: 500_000  (stick to liquid pairs)
#   $500 capital → min_pair_volume_usdt: 1_000_000
#   $5k  capital → min_pair_volume_usdt: 5_000_000
discovery:
  # $250k daily volume floor discovers ~50% more triangles than $500k
  # while keeping pairs liquid enough for $15 trade sizes.
  # Typical result: 150-250 triangles vs ~100 at $500k floor.
  min_pair_volume_usdt: 250_000   # min 24h USDT volume per pair
  max_triangles: 300              # cap — well within Binance's 1024 WS stream limit
  bridge_currencies:              # MID leg currencies (most cross-pair coverage)
    - BTC
    - ETH
    - BNB

triangular:
  auto_discover: true   # false = only scan pairs listed in `triangles` below

  # Manual overrides — only used when auto_discover: false,
  # or to force-include a specific triangle auto-discovery might miss.
  triangles: []

  # ── Profit thresholds ──────────────────────────────────────
  # With fee_rate=0.1% × 3 legs = 0.3% total:
  #   min_profit_pct=0.5% means we need a 0.5% NET spread to trade.
  #   Combined with min_profit_fee_ratio=1.5 (profit ≥ 1.5× fees),
  #   the effective entry is max(0.5%, 0.45%) = 0.5%.
  # 0.6% = 0.3% fees + 0.15% slippage buffer + 0.15% profit margin.
  # Raising from 0.5% → 0.6% ensures we don't trade opportunities that
  # look profitable on paper but go negative with real-world slippage.
  min_profit_pct: 0.6
  trade_amount_usdt: 15
  max_trade_amount_usdt: 20
  fee_rate: 0.001         # 0.1% standard | 0.00075 with BNB fee discount
  order_timeout_seconds: 8
  min_notional_usdt: 6    # Binance rejects orders below ~$5 notional

risk:
  # ── What each limit protects against ──────────────────────
  #
  # max_daily_loss_usdt ($5):
  #   Total net PnL floor for the day.
  #   Includes fees, slippage, partial-fill losses.
  #   This is NOT just fees — it's everything.
  #   $5 = 10% of $50 capital. Reasonable single-day limit.
  #
  # max_drawdown_pct (10%):
  #   If balance ever falls 10% below its highest point this session,
  #   halt. Catches a slow bleed that daily loss might miss.
  #
  # max_daily_fees_usdt ($3):
  #   Gross fees paid to Binance today.
  #   At $0.045/cycle this allows ~66 cycles.
  #   If fees hit $3 before profits do, the market isn't giving
  #   real opportunities — stop churning.
  #
  # max_loss_per_trade_usdt ($1):
  #   Any single cycle that loses > $1 halts the bot immediately.
  #   Catches catastrophic slippage or a failed recovery order.
  #   $1 = 2% of $50.
  #
  # max_consecutive_losses (3):
  #   3 losses in a row → 5-minute pause (not halt).
  #   Market conditions may have shifted. Take a breath.
  #
  # min_profit_fee_ratio (1.5):
  #   Profit must be ≥ 1.5× total fee cost.
  #   Filters opportunities that look profitable in theory but go
  #   negative on any real-world slippage.
  #
  max_daily_loss_usdt: 5
  max_drawdown_pct: 10
  max_daily_fees_usdt: 3
  max_loss_per_trade_usdt: 1
  max_consecutive_losses: 3
  consecutive_loss_cooldown_seconds: 300
  min_profit_fee_ratio: 1.5
  max_open_orders: 1
  min_balance_usdt: 10
  max_position_pct: 35

  # ── Scaling guide ──────────────────────────────────────────
  # When you scale capital, update these proportionally:
  #   $500 capital:
  #     max_daily_loss_usdt: 50
  #     max_daily_fees_usdt: 20
  #     max_loss_per_trade_usdt: 10
  #     min_balance_usdt: 50
  #     trade_amount_usdt: 100  (in triangular section)
  #   $5000 capital:
  #     max_daily_loss_usdt: 250
  #     max_daily_fees_usdt: 100
  #     max_loss_per_trade_usdt: 50
  #     min_balance_usdt: 200
  #     trade_amount_usdt: 500  (in triangular section)

performance:
  report_interval_minutes: 60
  save_trades_csv: true
  trades_file: logs/trades.csv
