# ============================================================
# Arbitrage Bot — Binance-Only, Auto-Execute
# ============================================================
# VPS: Tokyo, Japan (AWS ap-northeast-1 OR Vultr Tokyo HF)
#   Binance's matching engine runs on AWS Tokyo.
#   Best value:  Vultr Tokyo High Frequency — ~$24/month, ~2ms to Binance
#   Best latency: AWS EC2 c5n.large Tokyo    — ~$85/month, sub-1ms
#   Budget pick:  Contabo VPS Tokyo          — ~$7/month,  ~3-5ms
# ============================================================

bot:
  mode: live          # auto-execute — real trades will be placed
  log_level: INFO
  heartbeat_interval: 30   # seconds
  startup_countdown: 5     # seconds to abort before live trading begins

exchanges:
  binance:
    # Set credentials in .env: BINANCE_API_KEY, BINANCE_API_SECRET
    recv_window: 5000      # ms — tight window rejects stale orders fast
    websocket_reconnect_delay: 1   # seconds before WS reconnect attempt
    # Enable BNB fee discount on your Binance account to use 0.075% fees
    use_bnb_for_fees: false

triangular:
  # Triangles ordered by typical spread/volume on Binance
  triangles:
    - [USDT, BTC, ETH]
    - [USDT, BTC, BNB]
    - [USDT, BTC, SOL]
    - [USDT, BTC, XRP]
    - [USDT, BTC, ADA]
    - [USDT, BTC, DOGE]
    - [USDT, BTC, LTC]
    - [USDT, ETH, BNB]
    - [USDT, ETH, SOL]
    - [USDT, ETH, MATIC]
    - [USDT, BNB, SOL]
    - [USDT, BNB, XRP]

  min_profit_pct: 0.12       # % net profit threshold (after all fees)
  trade_amount_usdt: 100     # USDT per trade cycle
  max_trade_amount_usdt: 1000
  # Standard Binance fee: 0.1% | With BNB discount: 0.075%
  fee_rate: 0.001
  order_timeout_seconds: 8   # cancel & abort cycle if a leg hangs

risk:
  max_daily_loss_usdt: 50    # halt for the day if losses hit this
  max_drawdown_pct: 5        # % of starting balance — halt if breached
  max_open_orders: 2         # triangular needs 3 legs; keep concurrency low
  min_balance_usdt: 25       # hard floor — never trade below this
  max_position_pct: 25       # max % of balance per trade cycle

performance:
  report_interval_minutes: 60
  save_trades_csv: true
  trades_file: logs/trades.csv
